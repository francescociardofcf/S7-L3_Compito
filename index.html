<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="placeholder Odradek - Gestisci il tuo carrello" />
    <meta name="X-UA-Compatible" content="IE=edge" />
    <title>Libreria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container my-5">
      <div>
        <a href="https://www.repubblica.it" target="_blank"></a>
        <button class="btn btn-info mb-4">Gestisci il tuo carrello</button>
      </div>
    </div>
    <div>
      <h1 class="text-center mb-4">Libreria Odradek</h1>
      <div id="books-row" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
    </div>
    <div id="cards" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <img src="./materiali/1627863.png" alt="Loading..." class="mx-auto d-block my-5" /> 
    <img src="./materiali/1627865.png" alt="Loading..." class="mx-auto d-block my-5" />
    <img src="./materiali/1627866.png" alt="Loading..." class="mx-auto d-block my-5" />
    </div> 
<button id="load-more-btn" class="btn btn-primary my-4">Carica altri libri</button>
    <card inputmode="books-row"></card>
    <section id="cart-section" class="my-5">
      <h2>Carrello</h2>
      <div id="cart-items" class="table-responsive"></div>
      <h3 id="cart-total" class="mt-3">Totale: €0.00</h3>
      <button id="checkout-btn" class="btn btn-success mt-3">Procedi al pagamento</button>  

  </body>
</html>
