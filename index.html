<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="placeholder Odradek - Gestisci il tuo carrello" />
    <meta name="X-UA-Compatible" content="IE=edge" />
    <title>Libreria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link href="stylesheet" rel="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container my-5">
      <div>
        <a href="https://www.repubblica.it" target="_blank"></a>
        <button class="btn btn-info mb-4">Gestisci il tuo carrello</button>
      </div>
    </div>
    <div>
      <h1 class="text-center mb-4">Libreria Odradek</h1>
      <div id="books-row" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
    </div>

    <script>
      fetch("https://striveschool-api.herokuapp.com/books")
        .then(response => response.json())
        .then(books => {
          const booksRow = document.getElementById("books-row");
          books.forEach(book => {
            const col = document.createElement("div");
            col.className = "col";

            col.innerHTML = `
                    <div class="card h-100">
                      <img src="${book.img}" class="card-img-top" alt="${book.title}">
                      <div class="card-body d-flex flex-column">
                        <h5 class="card-title">${book.title}</h5>
                        <p class="card-text">Prezzo: € ${book.price}</p>
                        <button class="async (params) => {
                        }">Aggiungi al carrello</button>
                      </div>
                    </div>
                  `;

            col.querySelector(".scarta-btn").addEventListener("click", () => {
              col.remove();
            });

            booksRow.appendChild(col);
          });
        })
        .catch(error => console.error("Errore nella fetch:", error));
    </script>
  </body>
</html>
