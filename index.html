<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Libreria Odradek - Gestisci il tuo carrello" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Libreria Odradek</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-center flex-grow-1">📚 Libreria Odradek</h1>
        <a href="./backoffice.html" class="btn btn-warning ms-3">Backoffice</a>
      </div>

      <div class="text-center mb-5">
        <a href="https://www.repubblica.it" target="_blank" class="btn btn-info">
          Gestisci il tuo carrello
        </a>
      </div>

      <!-- Galleria di libri -->
      <div id="books-row" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <!-- Le card dei libri saranno generate dinamicamente da logica.js -->
      </div>

      <div class="text-center">
        <button id="load-more-btn" class="btn btn-primary mt-4">Carica altri libri</button>
      </div>

      <!-- Sezione caricamento o immagini placeholder -->
      <div id="cards" class="row justify-content-center my-5">
        <div class="col-6 col-md-3 text-center">
          <img src="./materiali/1627863.png" alt="Loading..." class="img-fluid my-3" />
        </div>
        <div class="col-6 col-md-3 text-center">
          <img src="./materiali/1627865.png" alt="Loading..." class="img-fluid my-3" />
        </div>
        <div class="col-6 col-md-3 text-center">
          <img src="./materiali/1627866.png" alt="Loading..." class="img-fluid my-3" />
        </div>
      </div>

      <!-- Sezione carrello -->
      <section id="cart-section" class="my-5">
        <h2 class="mb-3">🛒 Carrello</h2>
        <div id="cart-items" class="table-responsive">
          <!-- Gli elementi del carrello saranno inseriti qui dinamicamente -->
        </div>

        <h3 id="cart-total" class="mt-3">Totale: €0.00</h3>

        <div class="mt-4 d-flex flex-wrap gap-3">
          <a href="https://amazon.it" target="_blank" class="btn btn-secondary">
            Vai al carrello
          </a>
          <button id="checkout-btn" class="btn btn-success">Procedi al pagamento</button>
        </div>
      </section>

      <!-- Sezione categorie -->
      <section id="categories" class="my-5 text-center">
        <h2 class="mb-4">Categorie</h2>
        <div class="d-flex justify-content-center flex-wrap gap-3">
          <button class="btn btn-warning category-btn" data-category="electronics">Electronics</button>
          <button class="btn btn-warning category-btn" data-category="clothing">Clothing</button>
          <button class="btn btn-warning category-btn" data-category="furniture">Furniture</button>
        </div>
      </section>
    </div>

    <!-- Script -->
    <script src="./backoffice.js"></script>
    <script src="./logica.js"></script>
  </body>
</html>
